name: Bot Empresa Flores

on:
  schedule:
    - cron: '0 12 * * *' # Se ejecuta todos los días a las 09:00 AM (Hora Argentina)
  workflow_dispatch: # Te permite ejecutarlo manualmente con un botón cuando quieras

jobs:
  scraping:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar librerías
      run: |
        pip install selenium webdriver-manager google-auth google-api-python-client

    - name: Ejecutar el explorador
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: python main.py
